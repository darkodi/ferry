# ElasticMQ (SQS-compatible) config for local development and tests.
# Queue names and the redrive policy match what Terraform creates on AWS (M7).
include classpath("application.conf")

node-address {
  protocol = http
  host = localhost
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

aws {
  region = us-east-1
  accountId = 000000000000
}

queues {
  # payout events from the outbox relay; read by cmd/worker
  ferry-payouts {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 0 seconds
    # After 5 failed deliveries a message moves to the DLQ (queue.MaxReceives).
    deadLettersQueue {
      name = "ferry-payouts-dlq"
      maxReceiveCount = 5
    }
  }
  ferry-payouts-dlq {}
}
