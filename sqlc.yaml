version: "2"

sql:
  - engine: postgresql
    schema: migrations
    queries: internal/ledger/queries.sql
    gen:
      go:
        package: ledgerdb
        out: internal/ledger/ledgerdb
        sql_package: pgx/v5
        overrides: &overrides
          # Ledger amounts are numeric(38,0) constrained to the int64 range,
          # so they map to int64 (never float64).
          - db_type: pg_catalog.numeric
            go_type: int64
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: text
            nullable: true
            go_type:
              type: string
              pointer: true
  - engine: postgresql
    schema: migrations
    queries: internal/customer/queries.sql
    gen:
      go:
        package: customerdb
        out: internal/customer/customerdb
        sql_package: pgx/v5
        overrides: *overrides
  - engine: postgresql
    schema: migrations
    queries: internal/payout/queries.sql
    gen:
      go:
        package: payoutdb
        out: internal/payout/payoutdb
        sql_package: pgx/v5
        overrides: *overrides
  - engine: postgresql
    schema: migrations
    queries: internal/idempotency/queries.sql
    gen:
      go:
        package: idempotencydb
        out: internal/idempotency/idempotencydb
        sql_package: pgx/v5
        overrides: *overrides
  - engine: postgresql
    schema: migrations
    queries: internal/outbox/queries.sql
    gen:
      go:
        package: outboxdb
        out: internal/outbox/outboxdb
        sql_package: pgx/v5
        overrides: *overrides
  - engine: postgresql
    schema: migrations
    queries: internal/chain/queries.sql
    gen:
      go:
        package: chaindb
        out: internal/chain/chaindb
        sql_package: pgx/v5
        overrides: *overrides
  - engine: postgresql
    schema: migrations
    queries: internal/destination/queries.sql
    gen:
      go:
        package: destinationdb
        out: internal/destination/destinationdb
        sql_package: pgx/v5
        overrides: *overrides
