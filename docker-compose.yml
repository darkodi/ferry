name: ferry

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ferry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ferry}
      POSTGRES_DB: ${POSTGRES_DB:-ferry}
    ports:
      # Bind to loopback only: the dev database is never reachable from the LAN.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # SQS-compatible queue. On AWS (M7) this is real SQS with the same queues.
  elasticmq:
    image: softwaremill/elasticmq-native:1.7.1
    ports:
      - "127.0.0.1:${ELASTICMQ_PORT:-9324}:9324"
    volumes:
      - ./deploy/elasticmq.conf:/opt/elasticmq.conf:ro

  # Local EVM chain for deposits. Mines a block every 2 seconds so
  # confirmations accrue on their own. State is in memory: restarting it
  # resets the chain (run `make chain-setup` again).
  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.8.6
    command: ["anvil --host 0.0.0.0 --chain-id 31337 --block-time 2"]
    ports:
      - "127.0.0.1:${ANVIL_PORT:-8545}:8545"

  # Local Solana validator for deposits. State is in memory (--reset):
  # restarting it resets the chain (run `make chain-setup` again). Dev
  # keypairs live in ./.dev/solana (git-ignored) so addresses survive that.
  # Agave 3 needs io_uring, which Docker's default seccomp profile blocks,
  # hence seccomp=unconfined; the RPC port is bound to loopback only.
  solana:
    image: anzaxyz/agave:v3.1.14
    entrypoint: ["solana-test-validator"]
    command: ["--ledger", "/tmp/ledger", "--reset", "--quiet"]
    security_opt:
      - seccomp=unconfined
    ports:
      - "127.0.0.1:${SOLANA_RPC_PORT:-8899}:8899"
    volumes:
      - ./.dev/solana:/ferry
    healthcheck:
      test: ["CMD", "solana", "-u", "http://localhost:8899", "cluster-version"]
      interval: 2s
      timeout: 3s
      retries: 60

volumes:
  pgdata:
