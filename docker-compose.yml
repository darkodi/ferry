name: ferry

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ferry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ferry}
      POSTGRES_DB: ${POSTGRES_DB:-ferry}
    ports:
      # Bind to loopback only: the dev database is never reachable from the LAN.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # SQS-compatible queue. On AWS (M7) this is real SQS with the same queues.
  elasticmq:
    image: softwaremill/elasticmq-native:1.7.1
    ports:
      - "127.0.0.1:${ELASTICMQ_PORT:-9324}:9324"
    volumes:
      - ./deploy/elasticmq.conf:/opt/elasticmq.conf:ro

volumes:
  pgdata:
